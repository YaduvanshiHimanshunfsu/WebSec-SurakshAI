<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;min-height:100vh;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={theme:{extend:{"colors":{"primary":"#4648d4","on-tertiary":"#ffffff","inverse-on-surface":"#f2effb","surface-variant":"#e4e1ed","on-tertiary-container":"#fffbff","surface-bright":"#fcf8ff","surface-container-highest":"#e4e1ed","primary-container":"#6063ee","surface-dim":"#dbd8e4","error-container":"#ffdad6","tertiary":"#904900","secondary-fixed":"#e9ddff","tertiary-fixed-dim":"#ffb783","secondary-fixed-dim":"#d0bcff","surface-container-low":"#f5f2fe","outline-variant":"#c7c4d7","primary-fixed-dim":"#c0c1ff","outline":"#767586","on-primary-container":"#fffbff","surface-container":"#efecf8","inverse-primary":"#c0c1ff","surface-container-lowest":"#ffffff","on-tertiary-fixed":"#301400","on-primary-fixed-variant":"#2f2ebe","tertiary-fixed":"#ffdcc5","surface":"#fcf8ff","tertiary-container":"#b55d00","on-surface":"#1b1b23","surface-tint":"#494bd6","background":"#fcf8ff","error":"#ba1a1a","on-secondary":"#ffffff","secondary":"#6b38d4","secondary-container":"#8455ef","on-background":"#1b1b23","on-secondary-fixed":"#23005c","inverse-surface":"#303038","on-secondary-fixed-variant":"#5516be","on-error":"#ffffff","on-error-container":"#93000a","on-primary-fixed":"#07006c","on-secondary-container":"#fffbff","surface-container-high":"#e9e6f3","primary-fixed":"#e1e0ff","on-tertiary-fixed-variant":"#703700","on-surface-variant":"#464554","on-primary":"#ffffff"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"base":"4px","sm":"8px","2xl":"64px","xs":"4px","margin-desktop":"48px","gutter":"24px","xl":"40px","md":"16px","margin-mobile":"16px","lg":"24px"},"fontFamily":{"display-lg":["Plus Jakarta Sans"],"body-md":["Inter"],"headline-lg":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"body-lg":["Inter"],"label-sm":["Inter"],"label-md":["Inter"]},"fontSize":{"display-lg":["48px",{"lineHeight":"1.1","letterSpacing":"-0.02em","fontWeight":"800"}],"body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],"headline-lg":["32px",{"lineHeight":"1.2","letterSpacing":"-0.01em","fontWeight":"700"}],"headline-lg-mobile":["24px",{"lineHeight":"1.2","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"1.3","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"label-sm":["12px",{"lineHeight":"1.2","letterSpacing":"0.05em","fontWeight":"600"}],"label-md":["14px",{"lineHeight":"1.4","fontWeight":"500"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface flex flex-col min-h-screen"><main class="flex-1 w-full flex items-center justify-center relative overflow-hidden"><div class="flex flex-col w-full relative items-center justify-center min-h-[600px] py-12 px-4">
<!-- Animated Background & Noise -->
<div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
<svg class="absolute inset-0 w-full h-full opacity-[0.03] mix-blend-overlay" xmlns="http://www.w3.org/2000/svg">
<filter id="noiseFilter">
<feturbulence basefrequency="0.8" numoctaves="3" stitchtiles="stitch" type="fractalNoise"></feturbulence>
</filter>
<rect filter="url(#noiseFilter)" height="100%" width="100%"></rect>
</svg>
<!-- Background Blobs (Animated via JS) -->
<div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full blur-[100px] bg-primary-container opacity-40 mix-blend-multiply" id="blob1"></div>
<div class="absolute top-[10%] right-[-10%] w-[400px] h-[400px] rounded-full blur-[80px] bg-secondary-fixed opacity-50 mix-blend-multiply" id="blob2"></div>
<div class="absolute bottom-[-20%] left-[20%] w-[500px] h-[500px] rounded-full blur-[120px] bg-tertiary-fixed opacity-40 mix-blend-multiply" id="blob3"></div>
<!-- Particles Container -->
<div class="absolute inset-0" id="particles-container"></div>
</div>
<!-- Main Login Card -->
<div class="relative w-full max-w-[440px] z-10 transition-all duration-700 opacity-0 translate-y-8" id="login-card">
<!-- Animated Rainbow Shimmer Border Wrapper -->
<div class="absolute -inset-[2px] rounded-2xl bg-gradient-to-r from-primary via-secondary to-tertiary opacity-70 blur-[2px] rounded-xl overflow-hidden -z-10" id="rainbow-border"></div>
<!-- Card Surface -->
<div class="relative flex flex-col w-full bg-surface/70 backdrop-blur-2xl border border-surface-container-highest rounded-2xl p-8 shadow-2xl overflow-hidden">
<!-- Logo & Title -->
<div class="flex flex-col items-center text-center space-y-4 mb-8 stagger-item opacity-0 translate-y-4">
<div class="relative w-16 h-16 rounded-full bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-3xl">security</span>
<div class="absolute inset-0 rounded-full border border-on-primary/20 animate-ping opacity-20"></div>
</div>
<div>
<h1 class="font-headline-lg text-headline-lg text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">WebSec-SurakshAI</h1>
<div class="flex items-center justify-center gap-2 mt-3">
<span class="px-2 py-1 rounded-full bg-primary-container/20 text-primary font-label-sm text-label-sm border border-primary/20 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">smart_toy</span> AI-Powered
            </span>
<span class="px-2 py-1 rounded-full bg-secondary-container/20 text-secondary font-label-sm text-label-sm border border-secondary/20 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">school</span> NFSU Tripura
            </span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant h-[24px]" id="typewriter-text"></p>
</div>
<!-- Form -->
<form class="flex flex-col space-y-6 stagger-item opacity-0 translate-y-4" id="login-form" onsubmit="event.preventDefault(); handleLogin();">
<!-- Username -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface">Agent ID / Email</label>
<div class="relative group">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors">badge</span>
<input class="w-full bg-surface-container-lowest/50 border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="username" placeholder="agent@surakshai.gov" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface">Secure Passphrase</label>
<div class="relative group" id="pwd-container">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest/50 border border-outline-variant rounded-lg py-3 pl-10 pr-10 font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline" id="password" oninput="checkStrength(this.value)" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
<!-- Strength Meter -->
<div class="flex flex-col space-y-1 mt-1">
<div class="flex gap-1 h-1.5 w-full rounded-full overflow-hidden bg-surface-container-highest">
<div class="h-full w-1/3 bg-transparent transition-colors duration-300" id="str-1"></div>
<div class="h-full w-1/3 bg-transparent transition-colors duration-300" id="str-2"></div>
<div class="h-full w-1/3 bg-transparent transition-colors duration-300" id="str-3"></div>
</div>
<div class="flex justify-between items-center">
<span class="font-label-sm text-[10px] text-on-surface-variant uppercase tracking-wider" id="str-label">Strength: None</span>
<a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors" href="#">Forgot Passphrase?</a>
</div>
</div>
</div>
<!-- Submit -->
<button class="relative w-full py-3.5 rounded-lg bg-gradient-to-r from-primary to-secondary text-on-primary font-headline-md text-[16px] flex items-center justify-center gap-2 overflow-hidden group hover:shadow-lg hover:shadow-primary/30 transition-all hover:scale-[1.02]" id="submit-btn" type="submit">
<span class="relative z-10 flex items-center gap-2" id="btn-text">
            Enter Dashboard <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
</button>
</form>
<!-- Footer -->
<div class="mt-8 text-center stagger-item opacity-0 translate-y-4">
<p class="font-label-sm text-[11px] text-on-surface-variant flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[14px]">encrypted</span> Developed by Himanshu Yadav<br/>National Forensic Sciences University, Tripura
        </p>
</div>
</div>
</div>
<!-- Toast Container -->
<div class="fixed top-6 right-6 flex flex-col gap-3 z-50 pointer-events-none" id="toast-container"></div>
</div>
<script>
  // -- Initialization & Animations -- //
  document.addEventListener("DOMContentLoaded", () => {
    // Reveal Card
    setTimeout(() => {
      const card = document.getElementById('login-card');
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
      
      // Stagger items
      const items = document.querySelectorAll('.stagger-item');
      items.forEach((item, index) => {
        setTimeout(() => {
          item.style.transition = 'all 600ms cubic-bezier(0.34, 1.56, 0.64, 1)';
          item.style.opacity = '1';
          item.style.transform = 'translateY(0)';
        }, 100 + (index * 80));
      });
    }, 100);

    // Background Blobs Animation
    const animateBlob = (id, duration, keyframes) => {
      const el = document.getElementById(id);
      if(el) {
        el.animate(keyframes, {
          duration: duration,
          iterations: Infinity,
          direction: 'alternate',
          easing: 'ease-in-out'
        });
      }
    };

    animateBlob('blob1', 20000, [
      { transform: 'translate(0, 0) scale(1)' },
      { transform: 'translate(20%, 10%) scale(1.2)' },
      { transform: 'translate(-10%, 20%) scale(0.9)' }
    ]);
    animateBlob('blob2', 25000, [
      { transform: 'translate(0, 0) scale(1)' },
      { transform: 'translate(-30%, 15%) scale(1.1)' },
      { transform: 'translate(10%, -10%) scale(1)' }
    ]);
    animateBlob('blob3', 18000, [
      { transform: 'translate(0, 0) rotate(0deg)' },
      { transform: 'translate(15%, -20%) rotate(180deg)' }
    ]);

    // Rainbow Border Animation
    const rb = document.getElementById('rainbow-border');
    if(rb) {
      rb.animate([
        { filter: 'hue-rotate(0deg)' },
        { filter: 'hue-rotate(360deg)' }
      ], { duration: 6000, iterations: Infinity });
    }

    // Typewriter effect
    const phrases = ["Web Security", "Scam Detection", "Phishing Analysis"];
    let phraseIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typeTarget = document.getElementById('typewriter-text');
    
    function type() {
      const currentPhrase = phrases[phraseIndex];
      if (isDeleting) {
        typeTarget.innerText = currentPhrase.substring(0, charIndex - 1) + " |";
        charIndex--;
      } else {
        typeTarget.innerText = currentPhrase.substring(0, charIndex + 1) + " |";
        charIndex++;
      }

      let typeSpeed = isDeleting ? 50 : 100;

      if (!isDeleting && charIndex === currentPhrase.length) {
        typeSpeed = 2000;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        phraseIndex = (phraseIndex + 1) % phrases.length;
        typeSpeed = 500;
      }
      setTimeout(type, typeSpeed);
    }
    type();
  });

  // -- Interaction Logic -- //
  function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerText = 'visibility_off';
    } else {
      input.type = 'password';
      icon.innerText = 'visibility';
    }
  }

  function checkStrength(val) {
    const s1 = document.getElementById('str-1');
    const s2 = document.getElementById('str-2');
    const s3 = document.getElementById('str-3');
    const lbl = document.getElementById('str-label');
    
    // reset
    s1.style.backgroundColor = 'transparent';
    s2.style.backgroundColor = 'transparent';
    s3.style.backgroundColor = 'transparent';
    
    if (!val) {
      lbl.innerText = 'Strength: None';
      lbl.style.color = 'var(--on-surface-variant)';
      return;
    }
    
    let strength = 0;
    if (val.length > 5) strength++;
    if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val) && val.length > 8) strength++;

    if (strength === 1) {
      s1.style.backgroundColor = 'var(--error)';
      lbl.innerText = 'Strength: Weak';
      lbl.style.color = 'var(--error)';
    } else if (strength === 2) {
      s1.style.backgroundColor = 'var(--tertiary-container)';
      s2.style.backgroundColor = 'var(--tertiary-container)';
      lbl.innerText = 'Strength: Medium';
      lbl.style.color = 'var(--tertiary-container)';
    } else if (strength === 3) {
      s1.style.backgroundColor = '#10b981'; // Using direct hex for success green as it's not strictly in theme tokens
      s2.style.backgroundColor = '#10b981';
      s3.style.backgroundColor = '#10b981';
      lbl.innerText = 'Strength: Strong';
      lbl.style.color = '#10b981';
    } else {
      s1.style.backgroundColor = 'var(--error)';
      lbl.innerText = 'Strength: Weak';
      lbl.style.color = 'var(--error)';
    }
  }

  function showToast(message, isError = true) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `px-4 py-3 rounded-lg shadow-lg font-body-md text-label-md flex items-center gap-2 transform transition-all duration-300 translate-y-[-20px] opacity-0 ${isError ? 'bg-error-container text-on-error-container border border-error/20' : 'bg-primary-container text-on-primary border border-primary/20'}`;
    toast.innerHTML = `<span class="material-symbols-outlined">${isError ? 'error' : 'check_circle'}</span> ${message}`;
    
    container.appendChild(toast);
    
    // Animate in
    requestAnimationFrame(() => {
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
    });

    // Remove
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-20px)';
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  function handleLogin() {
    const btn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const pwd = document.getElementById('password').value;
    const pwdContainer = document.getElementById('pwd-container');
    const card = document.getElementById('login-card');

    // Loading state
    btnText.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span> Authenticating...`;
    btn.style.opacity = '0.8';
    btn.style.pointerEvents = 'none';

    setTimeout(() => {
      if (pwd.length < 8 || !/[A-Z]/.test(pwd) || !/[0-9]/.test(pwd)) {
        // Error state
        showToast("Access Denied: Incorrect passphrase or low clearance.", true);
        btnText.innerHTML = `Enter Dashboard <span class="material-symbols-outlined">arrow_forward</span>`;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        
        // Shake animation via JS Web Animations API
        pwdContainer.animate([
          { transform: 'translateX(0)' },
          { transform: 'translateX(-10px)' },
          { transform: 'translateX(10px)' },
          { transform: 'translateX(-10px)' },
          { transform: 'translateX(10px)' },
          { transform: 'translateX(0)' }
        ], { duration: 400, easing: 'ease-in-out' });
        
        document.getElementById('password').value = '';
        checkStrength('');
      } else {
        // Success state
        btn.className = "relative w-full py-3.5 rounded-lg bg-[#10b981] text-white font-headline-md text-[16px] flex items-center justify-center gap-2 overflow-hidden shadow-lg shadow-[#10b981]/40 transition-all";
        btnText.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Access Granted`;
        showToast("Authentication successful. Initializing secure tunnel...", false);
        
        setTimeout(() => {
          card.style.transform = 'scale(0.95) translateY(-20px)';
          card.style.opacity = '0';
        }, 1000);
      }
    }, 1500);
  }
</script></main></body></html>
