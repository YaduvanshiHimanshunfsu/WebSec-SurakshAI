<style>
  @keyframes shimmer {
    0% { background-position: 200% center; }
    100% { background-position: -200% center; }
  }
  @keyframes sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .animate-sweep {
    animation: sweep 1.5s infinite linear;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(5px); }
  }
  .shake-anim {
    animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Staggered Entrance
    const card = document.getElementById('mfa-card');
    const staggerItems = document.querySelectorAll('.stagger-item');
    
    setTimeout(() => {
      card.style.transition = 'opacity 0.6s ease-out, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
      card.style.opacity = '1';
      card.style.transform = 'translateY(0)';
      
      staggerItems.forEach((item, index) => {
        setTimeout(() => {
          item.style.transition = 'opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1)';
          item.style.opacity = '1';
          item.style.transform = 'translateY(0)';
        }, 100 + (index * 100));
      });
    }, 100);

    // OTP Input Logic
    const inputs = document.querySelectorAll('.otp-input');
    
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1) {
          if (index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        }
      });
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value) {
          if (index > 0) {
            inputs[index - 1].focus();
          }
        }
      });
      
      // Allow paste
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/\D/g, '');
        if (pastedData) {
          for(let i=0; i<pastedData.length; i++) {
            if(inputs[i]) {
              inputs[i].value = pastedData[i];
              if(i < inputs.length - 1) inputs[i+1].focus();
              else inputs[i].focus();
            }
          }
        }
      });
    });

    // Timer Logic
    let timeLeft = 119; // 1:59
    const timerText = document.getElementById('timer-text');
    const timerRing = document.getElementById('timer-ring');
    const resendBtn = document.getElementById('resend-btn');
    const totalDash = 62.8;

    const timer = setInterval(() => {
      timeLeft--;
      
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerText.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      const dashoffset = totalDash - (timeLeft / 119) * totalDash;
      timerRing.style.strokeDashoffset = dashoffset;

      if (timeLeft <= 0) {
        clearInterval(timer);
        resendBtn.disabled = false;
        resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        timerRing.classList.remove('text-primary');
        timerRing.classList.add('text-error');
      }
    }, 1000);

    // Verification Logic (Simulation)
    const verifyBtn = document.getElementById('verify-btn');
    const btnText = document.getElementById('btn-text');
    const btnShimmer = document.getElementById('btn-shimmer');
    const errorMessage = document.getElementById('error-message');
    const toast = document.getElementById('toast');
    const otpContainer = document.getElementById('otp-container');

    verifyBtn.addEventListener('click', () => {
      const code = Array.from(inputs).map(i => i.value).join('');
      
      // Loading State
      btnText.innerHTML = 'Verifying... <span class="material-symbols-outlined animate-spin text-sm">autorenew</span>';
      btnShimmer.classList.add('animate-sweep');
      verifyBtn.disabled = true;
      errorMessage.style.opacity = '0';
      inputs.forEach(i => i.classList.remove('border-error', 'border-primary'));

      setTimeout(() => {
        btnShimmer.classList.remove('animate-sweep');
        
        // Mock validation: fail if not '123456', success otherwise (if all filled)
        if (code === '123456' || code.length === 6 && code !== '000000') {
          // Success
          btnText.innerHTML = '✓ Verified';
          verifyBtn.classList.remove('from-primary', 'to-secondary');
          verifyBtn.classList.add('bg-[#146c2e]', 'bg-none'); // Using inline for specific success color if not in tokens, but ideally use theme if available. Falling back to primary for safety or valid token if we had one. Let's use generic green hex for pure success visual as it's common, but sticking to tokens is better. Let's use tertiary container just to stay strictly within tokens if possible, but the prompt says 'flashes green'. I'll add a temporary class.
          verifyBtn.style.background = 'linear-gradient(to right, #2e7d32, #4caf50)';
          
          inputs.forEach(i => {
            i.style.borderColor = '#4caf50';
            i.style.color = '#4caf50';
            i.style.backgroundColor = 'rgba(76, 175, 80, 0.1)';
          });
          
          setTimeout(() => {
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
          }, 1000);
          
        } else {
          // Error
          verifyBtn.disabled = false;
          btnText.innerHTML = `Verify & Access <span class="material-symbols-outlined transform group-hover:translate-x-1 transition-transform">arrow_forward</span>`;
          
          card.classList.add('shake-anim');
          setTimeout(() => card.classList.remove('shake-anim'), 500);
          
          errorMessage.style.opacity = '1';
          inputs.forEach(i => i.classList.add('border-error', 'text-error'));
          
          // Show toast
          toast.style.opacity = '1';
          toast.style.transform = 'translate(-50%, 0)';
          setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translate(-50%, -100%)';
          }, 3000);
        }
      }, 1500);
    });
  });
</script></main></body></html>
